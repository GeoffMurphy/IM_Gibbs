[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "imgibbs"
version = "2.0.0.dev0"
description = "Bayesian component separation and power spectrum estimation for 21cm intensity mapping data cubes"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Geoff Murphy" }]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
    "matplotlib",
    "astropy",
    "tqdm",
    "pyccl>=3.0",
    # FastBox generates the H I and foreground mocks everything runs on. This
    # pins a fork of it so an upstream change cannot silently move the
    # simulated truth. See README, "FastBox".
    "fastbox @ git+https://github.com/GeoffMurphy/FastBox.git",
]

[project.optional-dependencies]
notebooks = ["jupyter", "ipywidgets"]

[project.urls]
Homepage = "https://github.com/GeoffMurphy/IM_Gibbs"

[tool.setuptools.packages.find]
include = ["imgibbs*"]
